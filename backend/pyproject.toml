[project]
name = "matchmind"
version = "0.1.0"
description = "Multi-agent match intelligence for synthetic football matches"
authors = [
    { name = "Muhammad Ali Saeed", email = "alisaeed795555@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.20.0",
    "agent-framework-openai>=1.15.0",
    "agent-framework-orchestrations>=1.3.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
